{% load static %}

<!doctype html>
<html>
	<head>
		<title>Edit Alumni</title>

		<link rel="stylesheet" href="{% static 'admin_dashboard.css' %}" />

		<style>
			.edit-container {
				max-width: 700px;
				margin: auto;
				background: white;
				padding: 30px;
				border-radius: 15px;
				box-shadow: 0 6px 20px rgba(0, 0, 0, 0.05);
			}

			.edit-container h2 {
				margin-bottom: 20px;
			}

			.form-group {
				margin-bottom: 15px;
			}

			.form-group label {
				display: block;
				font-weight: 600;
				margin-bottom: 5px;
			}

			.form-group input,
			.form-group textarea {
				width: 100%;
				padding: 10px;
				border: 1px solid #ddd;
				border-radius: 6px;
			}

			.save-btn {
				background: #2d6a4f;
				color: white;
				border: none;
				padding: 10px 18px;
				border-radius: 6px;
				cursor: pointer;
			}

			.cancel-btn {
				margin-left: 10px;
				text-decoration: none;
			}
		</style>
	</head>

	<body>
		<div class="edit-container">
			<h2>Edit Alumni - {{ alumni.user.username }}</h2>

			<form method="POST" enctype="multipart/form-data">
				{% csrf_token %} {% for field in form %}

				<div class="form-group">
					<label>{{ field.label }}</label>

					{{ field }} {% if field.errors %}
					<p style="color: red">{{ field.errors }}</p>
					{% endif %}
				</div>

				{% endfor %}

				<button type="submit" class="save-btn">Save Changes</button>

				<a href="{% url 'admin_view_alumni' %}" class="cancel-btn"> Cancel </a>
			</form>
		</div>
	</body>
</html>

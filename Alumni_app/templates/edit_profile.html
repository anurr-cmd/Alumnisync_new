<form method="post" enctype="multipart/form-data">
    {% csrf_token %}

    {{ form.non_field_errors }}

    {% for field in form %}
        <p>
            {{ field.label_tag }}
            {{ field }}

            {% if field.errors %}
                <span style="color:red">{{ field.errors }}</span>
            {% endif %}
        </p>
    {% endfor %}

    <button type="submit">Submit</button>
</form>
